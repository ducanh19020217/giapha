    <path d="M800,320 m-12,0 a12,12 0 1,1 12,12 a6,6 0 1,1 -6,-6" stroke-width="3"/>
    <path d="M800,280 C790,262 805,250 800,236 M835,295 C850,285 848,270 862,262 M765,295 C750,285 752,270 738,262
