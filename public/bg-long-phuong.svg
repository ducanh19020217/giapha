             M300,410 l-24,-2 l20,-12 M330,470 l-20,10 l10,-20 M395,500 l6,-22 l6,22 M430,570 l22,-8 l-10,20 M405,660 l20,8 l-22,6
             M330,700 l4,24 l-18,-14 M250,705 l-2,-24 l-14,20 M180,745 l-20,-12 l22,0 M140,830 l-24,4 l18,-16 M150,900 l-20,14 l8,-22"
