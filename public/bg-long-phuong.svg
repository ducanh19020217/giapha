    <path d="M600,345 C630,352 665,346 690,330" stroke="#B87333" stroke-width="3"/>
    <circle cx="612" cy="310" r="7" stroke="#B87333" stroke-width="3"/>
    <circle cx="612" cy="310" r="2.5" fill="#B87333"/>
    <path d="M595,298 C605,288 622,288 632,296" stroke="#B87333" stroke-width="3"/>
    <!-- Sừng -->
    <path d="M575,294 C562,255 582,232 615,228 M592,292 C592,262 612,246 642,246" stroke="#B87333" stroke-width="5"/>
    <!-- Râu -->
    <path d="M688,305 C740,290 770,300 790,268 C800,252 790,238 778,244" stroke="#B87333" stroke-width="3"/>
    <path d="M672,332 C715,350 735,390 718,425 C710,440 694,438 694,426" stroke="#B87333" stroke-width="3"/>
