<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Hình nền "Long Phượng tranh châu" dạng nét mảnh, dùng làm watermark mờ phía sau cây gia phả. -->
  <defs>
    <!-- Mây tường vân -->
    <g id="cloud" fill="none" stroke="#B87333" stroke-width="3" stroke-linecap="round">
      <path d="M0,40 C0,15 25,0 45,10 C55,-12 95,-12 105,12 C125,0 150,15 145,40 Z"/>
      <path d="M45,10 C40,25 55,35 65,28 C72,22 68,12 60,14"/>
      <path d="M105,12 C112,28 98,38 88,30 C82,24 86,15 94,17"/>
      <path d="M20,40 C25,55 45,58 55,48"/>
      <path d="M95,48 C105,58 125,55 130,40"/>
    </g>
    <!-- Móng vuốt 3 ngón -->
    <g id="claw" fill="none" stroke="#B87333" stroke-width="4" stroke-linecap="round">
      <path d="M0,0 C-10,10 -22,12 -30,6"/>
      <path d="M0,0 C-6,14 -14,22 -24,24"/>
      <path d="M0,0 C2,14 -2,24 -10,30"/>
    </g>
    <!-- Lông đuôi phượng -->
    <g id="plumeEye" fill="none" stroke="#B87333" stroke-width="3">
      <ellipse cx="0" cy="0" rx="16" ry="11"/>
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#B87333" fill-opacity="0.35"/>
    </g>
  </defs>

  <!-- Mây rải rác -->
  <use xlink:href="#cloud" transform="translate(90,90) scale(1.2)"/>
  <use xlink:href="#cloud" transform="translate(700,80) scale(0.9)"/>
  <use xlink:href="#cloud" transform="translate(1380,70) scale(1.1)"/>
  <use xlink:href="#cloud" transform="translate(620,560) scale(1.3)"/>
  <use xlink:href="#cloud" transform="translate(880,760) scale(1)"/>
  <use xlink:href="#cloud" transform="translate(40,500) scale(0.8)"/>
  <use xlink:href="#cloud" transform="translate(1430,560) scale(0.85)"/>
  <use xlink:href="#cloud" transform="translate(470,880) scale(0.9)"/>
  <use xlink:href="#cloud" transform="translate(1180,900) scale(0.8)"/>

  <!-- ===== RỒNG (bên trái) ===== -->
