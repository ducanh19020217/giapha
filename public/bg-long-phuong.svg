  <!-- Viền hoa văn góc (vân hồi) -->
  <g fill="none" stroke="#B87333" stroke-width="3" stroke-linecap="square">
    <path d="M20,120 V20 H120 M40,120 V40 H120 M40,80 H80 V40"/>
    <path d="M1580,120 V20 H1480 M1560,120 V40 H1480 M1560,80 H1520 V40"/>
    <path d="M20,880 V980 H120 M40,880 V960 H120 M40,920 H80 V960"/>
    <path d="M1580,880 V980 H1480 M1560,880 V960 H1480 M1560,920 H1520 V960"/>
