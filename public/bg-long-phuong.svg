    <circle cx="1057" cy="249" r="3" fill="#B87333"/>
    <!-- Mỏ -->
    <path d="M1046,244 L1018,254 L1046,256" stroke-width="3.5"/>
    <!-- Mào -->
    <path d="M1064,232 C1060,210 1070,195 1088,192 C1080,205 1084,212 1094,212 M1072,236 C1080,218 1098,212 1112,220 M1052,236 C1040,220 1044,205 1056,198"
          stroke-width="3"/>
    <!-- Lông cổ rủ -->
    <path d="M1072,272 C1080,290 1072,305 1060,312 M1082,262 C1098,278 1096,300 1086,310" stroke-width="2.5"/>
